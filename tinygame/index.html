<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Document PiP - Move Element</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 40px;
    }

    #pip-container {
      margin-top: 30px;
    }

    #my-element {
      width: 300px;
      padding: 30px;
      border-radius: 16px;
      background: #292929;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    #counter {
      font-size: 48px;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <h1>My Web App</h1>

  <button id="pip-button">
    Open in Picture-in-Picture
  </button>

  <div id="pip-container">

    <div id="my-element">
      <h2>My Floating Widget</h2>

      <div id="counter">0</div>

      <button id="minus">−</button>
      <button id="plus">+</button>
    </div>

  </div>

  <script>
    const pipButton = document.getElementById("pip-button");
    const element = document.getElementById("my-element");
    const container = document.getElementById("pip-container");

    // Keep a direct reference to the counter element.
    // This reference remains valid even when the element
    // is moved into the PiP document.
    const counter = document.getElementById("counter");

    let count = 0;

    // Increment
    document.getElementById("plus").addEventListener("click", () => {
      count++;
      counter.textContent = count;
    });

    // Decrement
    document.getElementById("minus").addEventListener("click", () => {
      count--;
      counter.textContent = count;
    });


    pipButton.addEventListener("click", async () => {

      // Check browser support
      if (!("documentPictureInPicture" in window)) {
        alert("Document Picture-in-Picture is not supported.");
        return;
      }

      try {
        // Open the PiP window
        const pipWindow =
          await documentPictureInPicture.requestWindow({
            width: 350,
            height: 300
          });


        // Copy the page's styles into the PiP window
        for (const styleSheet of document.styleSheets) {
          try {
            const cssRules = [...styleSheet.cssRules]
              .map(rule => rule.cssText)
              .join("");

            const style = pipWindow.document.createElement("style");

            style.textContent = cssRules;

            pipWindow.document.head.appendChild(style);

          } catch (error) {
            // Some external stylesheets cannot be accessed.
            // We can safely ignore those here.
          }
        }


        // Move the EXISTING element into the PiP window.
        //
        // The element is not cloned or recreated.
        // Its event listeners and state remain intact.
        pipWindow.document.body.appendChild(element);


        // When the PiP window closes,
        // move the same element back to the main page.
        pipWindow.addEventListener("pagehide", () => {
          container.appendChild(element);
        });

      } catch (error) {
        console.error("Could not open Picture-in-Picture:", error);
      }
    });

  </script>

</body>
</html>
